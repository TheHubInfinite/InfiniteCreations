<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Infinite Creations</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#17231f">
<style>
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/dm-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/dm-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/space-grotesk-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}
:root{--ink:#17231f;--cream:#f4f0e6;--paper:#fffdf7;--orange:#ff6542;--blue:#4776ff;--green:#b8ef72;--line:#d9d4c8;--muted:#5f6864;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
a{text-decoration:none}
.wrap{max-width:560px;text-align:center}
.code{font-family:"Space Grotesk",sans-serif;font-size:clamp(80px,22vw,160px);font-weight:700;letter-spacing:-6px;line-height:1;position:relative;display:inline-block}
.code span{color:transparent;-webkit-text-stroke:2px var(--ink)}
.blob{width:70px;height:70px;background:var(--orange);border-radius:46% 54% 61% 39%;position:absolute;right:-10px;top:-6px;z-index:-1;transform:rotate(-10deg)}
h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(24px,4vw,32px);letter-spacing:-1px;margin:18px 0 10px}
p{color:var(--muted);font-size:16px;line-height:1.6;max-width:420px;margin:0 auto 28px}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;padding:14px 22px;border-radius:8px;font-weight:700;font-size:14px;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn-dark{background:var(--ink);color:#fff}.btn-orange{background:var(--orange);color:var(--ink)}
.note{margin-top:34px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 20px;font-size:14px;color:var(--muted)}
.note a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--orange)}
</style>
</head>
<body>
<div class="wrap">
 <div class="code"><span>4</span>0<span>4</span><span class="blob" aria-hidden="true"></span></div>
 <h1>This page took a wrong turn.</h1>
 <p>The page you're looking for doesn't exist, may have moved, or the link might have a typo. Let's get you back on track.</p>
 <div class="buttons">
  <a class="btn btn-dark" href="/">Back to homepage</a>
  <a class="btn btn-orange" href="/#contact">Contact us</a>
 </div>
 <div class="note">Still stuck? Email us at <a href="mailto:thehubinfinite@gmail.com">thehubinfinite@gmail.com</a> or call <a href="tel:+916375548735">+91&nbsp;63755&nbsp;48735</a>.</div>
</div>
</body>
</html>
